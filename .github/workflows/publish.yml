name: Publish

# Publishes to npm on a version tag. The package is configured on npmjs.com as a Trusted Publisher
# for this repository and this workflow file, so no token is stored: the job's OIDC identity is the
# credential, and the package carries a provenance statement.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Lint, build and test
        run: |
          pnpm run lint
          pnpm run build
          pnpm run test

      - name: Publish
        run: npm publish --provenance --access public
