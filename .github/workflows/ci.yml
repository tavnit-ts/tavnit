name: CI

# engines.node is >=24. Node 24 has no native Temporal (the polyfill path), Node 26 has it,
# so the suite runs on both.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:coverage

      # The bundles of the lean entry points stay under their recorded gzip ceilings and hold no
      # dependency they must not (scripts/check-size.mjs). Bundle size does not depend on the Node version.
      - name: Size gate
        if: matrix.node == 24
        run: pnpm run size
